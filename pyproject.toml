[project]
name = "archimedes-gestures"
version = "0.1.0"
description = "Computer-vision gesture layer for the Archimedes FE result viewer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
camera = ["mediapipe>=0.10.14", "opencv-python-headless>=4.8"]
viewer = ["pyvista>=0.43"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archimedes_gestures"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
