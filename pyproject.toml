[project]
name = "archimedes-gestures"
version = "0.1.0"
description = "Browser CAD modeller and finite-element solver with a computer-vision hand-gesture interface"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["finite element", "FEM", "CAD", "computer vision", "hand gestures", "MediaPipe", "structural analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "joblib>=1.3", "pyamg>=5.0"]

[project.urls]
Homepage = "https://github.com/si-ux/archimedes"
Documentation = "https://github.com/si-ux/archimedes#readme"
Issues = "https://github.com/si-ux/archimedes/issues"
Changelog = "https://github.com/si-ux/archimedes/blob/main/CHANGELOG.md"

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
camera = ["mediapipe>=0.10.14", "opencv-python-headless>=4.8"]
viewer = ["pyvista>=0.43"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archimedes_gestures", "archimedes_fe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Archimedes/backend is a separate project with its own pyproject.toml
extend-exclude = ["Archimedes"]

[tool.ruff.lint]
# pinned explicitly so a newer Ruff with wider defaults gives the same result
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# console scripts: the modelling commands (beam, solve, ...) are provided by the console
"fe_scripts/*" = ["F821", "E741"]
