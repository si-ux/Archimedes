[project]
name = "archimedes-gestures"
version = "0.1.0"
description = "Computer-vision gesture layer for the Archimedes FE result viewer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
camera = ["mediapipe>=0.10.14", "opencv-python-headless>=4.8"]
viewer = ["pyvista>=0.43"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archimedes_gestures", "archimedes_fe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Archimedes/backend is a separate project with its own pyproject.toml
extend-exclude = ["Archimedes"]

[tool.ruff.lint.per-file-ignores]
# console scripts: the modelling commands (beam, solve, ...) are provided by the console
"fe_scripts/*" = ["F821", "E741"]
